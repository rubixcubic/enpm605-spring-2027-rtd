  <title
     id="title1">Two names, one object</title>
  <desc
     id="desc1">Three panels. Tag 1, after a = [1, 2, 3]: the name a has an arrow to a list object [1, 2, 3]. Tag 2, after b = a: the names a and b both have arrows to the same list object. Tag 3, after b.append(4): a and b still point to that one list, which now holds [1, 2, 3, 4].</desc>

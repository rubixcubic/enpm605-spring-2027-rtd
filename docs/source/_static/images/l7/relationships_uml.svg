  <desc
     id="desc1">A UML class diagram with four class boxes: Team, Robot and Sensor in a row, and Task below Team. Tag 1: a line from Team to Robot with a hollow diamond at Team and 0..3 at Robot. Tag 2: a line from Robot to Sensor with a filled diamond at Robot and 0..* at Sensor. Tag 3: a line from Team down to Task with an open arrowhead at Task and 0..* at Task.</desc>

  <title
     id="title1">A call() that never returns</title>
  <desc
     id="desc1">Two time lanes, time going right along an arrow at the bottom. The top lane, task_requester, holds one long bar that starts at tag 1 and runs off the right edge: the timer callback, waiting in call(). The bottom lane, task_server, holds a short bar, tag 2, with an arrow to it from the start of the long bar and an arrow from it back up to a small dashed box, tag 3, under the long bar: the reply, waiting.</desc>

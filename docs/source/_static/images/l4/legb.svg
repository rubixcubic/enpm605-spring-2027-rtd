  <title
     id="title1">The four scopes</title>
  <desc
     id="desc1">Four nested regions. Tag 4, the outermost, holds the built-in names, such as max. Tag 3, the module (global), holds robot and outer. Tag 2, the call outer() (enclosing), holds sensor and inner. Tag 1, the innermost, the call inner() (local), holds reading.</desc>

  <desc
     id="desc1">Seen from above, in the odom frame, whose x and y axes are drawn at the top left. A robot at the bottom left faces slightly up from the right. Tag 1: the goal, a dot at the top right. Tag 2: rho, a straight line from the robot to the goal. Tag 3: dx and dy, dashed lines along odom's x and y from the robot to the goal. Tag 4: the yaw, an arc from a dashed line parallel to odom's x to the robot's x axis. Tag 5: alpha, an arc from the robot's x axis to the line toward the goal.</desc>

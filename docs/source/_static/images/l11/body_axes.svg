  <desc
     id="desc1">Seen from above. Tag 1: the odom frame at the bottom left, its x axis to the right and its y axis up, in gray. A two-wheeled robot stands at position (x, y), shown by dashed lines to odom's axes, facing 30 degrees to the left of odom's x. Its own frame: tag 2, x points forward; tag 3, y points to its left; z points up, out of the page, drawn as a dot in a circle. Tag 4: the yaw, an arc from a dashed line parallel to odom's x to the robot's x, counterclockwise.</desc>

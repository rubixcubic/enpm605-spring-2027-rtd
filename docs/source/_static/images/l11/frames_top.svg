  <title
     id="title1">Three frames seen from above</title>
  <desc
     id="desc1">Seen from above, to scale. At the bottom left, the odom frame's x and y axes. A robot on its way, slightly up and to the right of odom, facing up and to the right, with its own axes, labeled base_footprint. Further up and right, the goal frame's axes, labeled goal, and to its right a box, the task site. Tag 1: an arrow from odom to base_footprint. Tag 2: an arrow from odom to goal. Tag 3: a dashed arrow from base_footprint to goal.</desc>

  <title
     id="title1">A differential drive robot</title>
  <desc
     id="desc1">Seen from above, a two-wheeled robot faces right. Its left wheel is at the top and its right wheel at the bottom. Three arrows point right, drawn to scale: tag 1, a short one from the left wheel; tag 3, a middle one, v, from the middle of the axle; tag 2, a long one from the right wheel. Tag 4: a curved arrow, the turn rate omega, around the middle of the axle, counterclockwise. Tag 5: L, the distance between the two wheels. A dashed line goes up from the axle to a dot, the center of the circle the robot drives on (tag 6), at distance R; a second dashed line through the three arrow tips meets it at that dot.</desc>

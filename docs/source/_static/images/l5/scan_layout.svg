  <title
     id="title1">The layout of a laser scan</title>
  <desc
     id="desc1">Not to scale. Tag 1: the robot at the center, a triangle facing right, with its x axis pointing right and its y axis pointing up. Four dashed rays leave the robot, each labeled with its index: 0 pointing backward (left), 90 pointing down (the robot's right), 180 pointing ahead (right), 270 pointing up (the robot's left). Tag 2: an arc from the x axis, counterclockwise, to one more ray at about 40 degrees, the angle theta_i of reading i. Tag 3: that ray, whose length is the range r_i. Tag 4: a dot at its end, the point the reading hit.</desc>
